[package]
name = "telematics"
version = "0.1.0"
edition = "2024"

[dependencies]
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "schema-sync", "entity-registry"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
